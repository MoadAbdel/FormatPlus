<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormaPlus - Assistant formation</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>FormaPlus</h1>
      <p>Assistant d’information formation</p>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <div class="message assistant">
        <p class="bubble">Bonjour et bienvenue chez FormaPlus. Je peux vous présenter nos formations, leurs prérequis, les étapes d’inscription et les financements possibles. Que souhaitez-vous savoir ?</p>
      </div>
    </section>

    <form id="chat-form" class="composer">
      <textarea id="prompt" rows="1" maxlength="1000" aria-label="Votre message"
        placeholder="Posez votre question…" required></textarea>
      <button type="submit">Envoyer</button>
    </form>
  </main>
  <script src="/app.js"></script>
</body>
</html>
