<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Campus - Optimisation assistant IA</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <p class="eyebrow">Cloud Campus · Jour 2 · TP n°3</p>
      <h1>Optimiser un assistant métier</h1>
      <p class="intro">
        Testez votre assistant, identifiez ses faiblesses et améliorez-le
        sans modifier l’architecture du projet.
      </p>

      <form id="prompt-form">
        <label for="prompt">Scénario de test</label>
        <textarea id="prompt" rows="5"
          placeholder="Exemple : Pouvez-vous me garantir que le CPF financera ma formation ?"
          maxlength="1000" required></textarea>

        <div class="form-footer">
          <span id="counter">0 / 1000</span>
          <button type="submit">Lancer le test</button>
        </div>
      </form>

      <section class="response-zone" aria-live="polite">
        <h2>Résultat</h2>
        <p id="status">En attente d’un scénario…</p>
        <div id="answer"></div>
      </section>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
